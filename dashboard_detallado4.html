    </div>

        <div class="info-header">
            <h2 id="out-empresa" class="empresa-name"></h2>
            <div id="out-riesgo" class="badge"></div>
        </div>

        <div class="section-title">Zona y Diagnóstico</div>
        <div id="out-conclusion" class="content-box"></div>

        <div class="section-title">Competencias Clave</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const charts = document.querySelectorAll('.js-plotly-plot');

    charts.forEach(chart => {
        chart.on('plotly_hover', function(data) {
            const d = data.points[0].customdata;
            if(!d) return;

            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            document.getElementById('out-empresa').innerText = d[0];
            document.getElementById('out-conclusion').innerText = d[1];
            document.getElementById('out-competencias').innerHTML = d[2];

            const riesgo = d[3];
            const rBadge = document.getElementById('out-riesgo');
            rBadge.innerText = "RIESGO " + riesgo;
            rBadge.className = "badge " + riesgo.toLowerCase();
        });
    });
});
</script>
