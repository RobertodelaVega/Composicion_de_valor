<script>
document.addEventListener('DOMContentLoaded', function() {
    const charts = document.querySelectorAll('.js-plotly-plot');

    charts.forEach(chart => {
        chart.on('plotly_hover', function(data) {
            const d = data.points[0].customdata;
            if(!d) return;

            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            document.getElementById('out-empresa').innerText = d[0];
            document.getElementById('out-conclusion').innerText = d[1];
            document.getElementById('out-competencias').innerHTML = d[2];

            const riesgo = d[3];
            const rBadge = document.getElementById('out-riesgo');
            rBadge.innerText = "RIESGO " + riesgo;
            rBadge.className = "badge " + riesgo.toLowerCase();
        });
    });
});
</script>
